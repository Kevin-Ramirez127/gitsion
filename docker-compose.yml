name: gitsion

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-gitsion}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-}
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        SITE_URL: ${SITE_URL:-}
        SITE_NAME: ${SITE_NAME:-gitsion}
    restart: unless-stopped
    init: true
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      BACKEND_URL: http://backend:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SITE_NAME: ${SITE_NAME:-}
      SITE_TITLE: ${SITE_TITLE:-}
      SITE_DESCRIPTION: ${SITE_DESCRIPTION:-}
      SITE_TAGLINE: ${SITE_TAGLINE:-}
      SITE_URL: ${SITE_URL:-}
      SITE_OG_IMAGE: ${SITE_OG_IMAGE:-}
      SITE_TWITTER: ${SITE_TWITTER:-}
      HERO_TITLE: ${HERO_TITLE:-}
      HERO_DESCRIPTION: ${HERO_DESCRIPTION:-}
      THEME_BG: ${THEME_BG:-}
      THEME_PANEL: ${THEME_PANEL:-}
      THEME_PANEL_2: ${THEME_PANEL_2:-}
      THEME_PANEL_HOVER: ${THEME_PANEL_HOVER:-}
      THEME_BORDER: ${THEME_BORDER:-}
      THEME_RULE_SOFT: ${THEME_RULE_SOFT:-}
      THEME_TEXT: ${THEME_TEXT:-}
      THEME_MUTED: ${THEME_MUTED:-}
      THEME_FAINT: ${THEME_FAINT:-}
      THEME_ACCENT: ${THEME_ACCENT:-}
      THEME_ACCENT_SOFT: ${THEME_ACCENT_SOFT:-}
      THEME_ON_STRONG: ${THEME_ON_STRONG:-}
      THEME_ON_ACCENT: ${THEME_ON_ACCENT:-}
      THEME_PLACEHOLDER: ${THEME_PLACEHOLDER:-}
      THEME_DARK_BG: ${THEME_DARK_BG:-}
      THEME_DARK_PANEL: ${THEME_DARK_PANEL:-}
      THEME_DARK_PANEL_2: ${THEME_DARK_PANEL_2:-}
      THEME_DARK_PANEL_HOVER: ${THEME_DARK_PANEL_HOVER:-}
      THEME_DARK_BORDER: ${THEME_DARK_BORDER:-}
      THEME_DARK_RULE_SOFT: ${THEME_DARK_RULE_SOFT:-}
      THEME_DARK_TEXT: ${THEME_DARK_TEXT:-}
      THEME_DARK_MUTED: ${THEME_DARK_MUTED:-}
      THEME_DARK_FAINT: ${THEME_DARK_FAINT:-}
      THEME_DARK_ACCENT: ${THEME_DARK_ACCENT:-}
      THEME_DARK_ACCENT_SOFT: ${THEME_DARK_ACCENT_SOFT:-}
      THEME_DARK_ON_STRONG: ${THEME_DARK_ON_STRONG:-}
      THEME_DARK_ON_ACCENT: ${THEME_DARK_ON_ACCENT:-}
      THEME_DARK_PLACEHOLDER: ${THEME_DARK_PLACEHOLDER:-}
      THEME_LIGHT_BG: ${THEME_LIGHT_BG:-}
      THEME_LIGHT_PANEL: ${THEME_LIGHT_PANEL:-}
      THEME_LIGHT_PANEL_2: ${THEME_LIGHT_PANEL_2:-}
      THEME_LIGHT_PANEL_HOVER: ${THEME_LIGHT_PANEL_HOVER:-}
      THEME_LIGHT_BORDER: ${THEME_LIGHT_BORDER:-}
      THEME_LIGHT_RULE_SOFT: ${THEME_LIGHT_RULE_SOFT:-}
      THEME_LIGHT_TEXT: ${THEME_LIGHT_TEXT:-}
      THEME_LIGHT_MUTED: ${THEME_LIGHT_MUTED:-}
      THEME_LIGHT_FAINT: ${THEME_LIGHT_FAINT:-}
      THEME_LIGHT_ACCENT: ${THEME_LIGHT_ACCENT:-}
      THEME_LIGHT_ACCENT_SOFT: ${THEME_LIGHT_ACCENT_SOFT:-}
      THEME_LIGHT_ON_STRONG: ${THEME_LIGHT_ON_STRONG:-}
      THEME_LIGHT_ON_ACCENT: ${THEME_LIGHT_ON_ACCENT:-}
      THEME_LIGHT_PLACEHOLDER: ${THEME_LIGHT_PLACEHOLDER:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
