name: gitsion

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-gitsion}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-}
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    init: true
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      BACKEND_URL: http://backend:8080
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4321/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
