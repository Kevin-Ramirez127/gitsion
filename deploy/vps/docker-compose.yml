# gitsion backend + MongoDB on the VPS, fronted by the existing Traefik.
#
# The frontend runs on Cloudflare Workers and reaches this backend through
# https://api.gitsion.librecourse.uy. Nothing is published on the host: only
# Traefik (traefik_net) can reach the backend, and Mongo stays internal.
#
# Run from the repository root:
#   docker compose -f deploy/vps/docker-compose.yml up -d --build
name: gitsion

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    networks:
      - gitsion_internal
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    init: true
    environment:
      PORT: "8080"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-gitsion}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-}
      SYNC_CONCURRENCY: ${SYNC_CONCURRENCY:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - gitsion_internal
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitsion-api.rule=Host(`api.gitsion.librecourse.uy`)"
      - "traefik.http.routers.gitsion-api.entrypoints=websecure"
      - "traefik.http.routers.gitsion-api.tls.certresolver=le"
      - "traefik.http.routers.gitsion-api.middlewares=crowdsec@docker"
      - "traefik.http.services.gitsion-api.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  gitsion_internal:
    name: gitsion_internal
    driver: bridge
  traefik_net:
    external: true

volumes:
  mongo-data:
    name: gitsion_mongo-data
